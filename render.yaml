services:
  - type: web
    name: sentinelai-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python backend/train_model.py"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: CORS_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
